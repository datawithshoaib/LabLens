[project]
name = "lablens-backend"
version = "0.1.0"
description = "Educational lab report explanation API foundation"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.20.0",
  "arq>=0.28.0",
  "asyncpg>=0.32.0",
  "boto3>=1.43.117",
  "fastapi>=0.115,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "pyjwt[crypto]>=2.15.1",
  "pymupdf>=2.0",
  "python-multipart>=0.0.32",
  "redis>=5.3.1",
  "sqlalchemy>=2.1.6",
  "uvicorn[standard]>=0.32,<1.0",
]

[dependency-groups]
dev = [
  "mypy>=1.13,<2.0",
  "ruff>=0.8,<1.0",
]

[build-system]
requires = ["hatchling>=1.26,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lablens"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "fitz.*"]
ignore_missing_imports = true
